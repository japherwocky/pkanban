# Per-IP limit for endpoints that can be hit without an existing session:
# signup and resend-verification can be used to spam outbound email (burning
# Resend quota and risking the sending domain's reputation), and /api/token
# is the login endpoint. 5r/m with a small burst survives normal double-clicks
# and retries while blocking scripted abuse.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
    listen 80;
    server_name pkanban.pearachute.com;

    # ACME Challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect HTTP to HTTPS (except for ACME challenges)
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name pkanban.pearachute.com;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/pkanban.pearachute.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pkanban.pearachute.com/privkey.pem;
    
    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate-limited auth endpoints -- exact matches take priority over the
    # general /api/ prefix location below, regardless of file order.
    location = /api/signup {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/resend-verification {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/token {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy to FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static files - serve directly from filesystem
    location /static/ {
        alias /opt/pkanban/backend/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Documentation markdown files - serve directly.
    #
    # Scoped to *.md on purpose. Two different things live under /docs/:
    # Docs.svelte fetches /docs/<section>.md for the content, but /docs,
    # /docs/<section> and /docs/commands/<page> are Svelte router paths
    # (see App.svelte) that have to reach FastAPI's SPA catch-all.
    #
    # A plain `location /docs/` captures both, so every docs page in the UI
    # 404s -- and /docs/commands 301s into a 403 directory listing, because a
    # directory of that name exists on disk. Only the .md fetches worked.
    #
    # The pattern allows a single nested directory segment (commands/board.md)
    # and no dots outside the extension, so it cannot be walked up out of
    # /opt/pkanban/docs.
    location ~ ^/docs/(?<docfile>[A-Za-z0-9_-]+(?:/[A-Za-z0-9_-]+)*\.md)$ {
        alias /opt/pkanban/docs/$docfile;
        default_type text/markdown;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Root path - proxy to FastAPI for Svelte app
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Logging
    access_log /var/log/nginx/pkanban.pearachute.com.access.log;
    error_log /var/log/nginx/pkanban.pearachute.com.error.log;
}