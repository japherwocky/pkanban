<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pkanban — Kanban for humans and AI agents</title>
    <meta
      name="description"
      content="A Kanban board built CLI-first: humans get a web dashboard, AI agents get simple commands over stdout. No SDKs, no wrappers."
    />
    <meta name="theme-color" content="#231f20" />

    <!--
      Favicon. favicon.svg carries a prefers-color-scheme swap (dark-mode
      browser chrome gets the brand cyan, light gets the AA-safe dark teal --
      see theme.css for why light mode needs the darker value). The PNGs are
      the fallback for browsers that don't do SVG favicons; no .ico -- every
      browser that still needs one is old enough to be a rounding error.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pkanban.pearachute.com" />
    <meta property="og:title" content="pkanban — Kanban for humans and AI agents" />
    <meta
      property="og:description"
      content="A Kanban board built CLI-first: humans get a web dashboard, AI agents get simple commands over stdout. No SDKs, no wrappers."
    />
    <meta property="og:image" content="https://pkanban.pearachute.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="pkanban — Kanban for humans and AI agents" />
    <meta
      name="twitter:description"
      content="A Kanban board built CLI-first: humans get a web dashboard, AI agents get simple commands over stdout. No SDKs, no wrappers."
    />
    <meta name="twitter:image" content="https://pkanban.pearachute.com/og-image.png" />

    <!--
      Fonts load here, not via @import in theme.css.

      An @import inside theme.css is flattened into app.css after Tailwind has
      already emitted its @layer statements, and CSS requires @import to precede
      everything except @charset and empty @layer. postcss therefore dropped it
      from the build entirely -- silently, with the site still compiling and
      deploying green. The result was a --font-sans naming a face the browser
      had never been told to fetch, so every page rendered in the system
      fallback. The previous Inter/JetBrains Mono pair had the same bug.

      A <link> has no ordering constraint, and lets us preconnect.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the stored theme before first paint. The Svelte store does this
      // too, but not until it mounts -- which is a full white flash on every
      // load, since the app defaults to dark. Must stay in sync with
      // getInitialTheme() in src/lib/theme.js.
      (function () {
        try {
          var t = localStorage.getItem('pkanban-theme');
          if (t !== 'light') document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
