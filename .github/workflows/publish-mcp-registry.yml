name: Publish to the MCP Registry

# Lists the hosted MCP server (server.json) in the official registry,
# registry.modelcontextprotocol.io, as io.github.japherwocky/pkanban.
#
# Run by hand from the Actions tab: a listing is public, so it goes out on
# purpose rather than as a side effect of a release. GitHub's OIDC token
# proves the io.github.japherwocky namespace, so no secret is needed.
# Publishing again with a new version updates the listing.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  # Pinned rather than "latest", so a new release of the publisher cannot
  # change what runs here without a commit.
  MCP_PUBLISHER_VERSION: v1.8.1

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Take the version from pyproject.toml
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          jq --arg v "$version" '.version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - name: Sign in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
