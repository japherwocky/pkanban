name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes ~3 minutes; a hung test should fail fast, not idle for 6 hours.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install CLI dependencies
        run: |
          pip install -e .

      - name: Check CLI docs are up to date
        run: |
          python scripts/generate_cli_docs.py --check

      - name: Run backend tests
        working-directory: ./backend
        run: |
          pytest

      - name: Run CLI tests
        working-directory: ./backend
        run: |
          pytest tests/test_cli.py

  # The frontend is served from backend/static, which is gitignored and built
  # on the server by sys/scripts/deploy.sh. Nothing here used to compile it, so
  # a Svelte or CSS error reached production without a single check failing --
  # the deploy's only gate is /api/health, which the backend answers happily
  # while the bundle is broken.
  #
  # Runs as its own job rather than as steps on `test` so it goes in parallel:
  # the Python suite gates nothing here, and vice versa.
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Before the build, because it needs no node_modules and because the
      # build cannot catch this class of fault: an undefined var(--x) compiles
      # cleanly and only fails in the browser, where it resolves to 'unset'
      # and silently blanks whatever it styled.
      - name: Check CSS custom properties are defined
        run: python3 scripts/check_css_tokens.py

      # npm prunes optional dependencies to the host platform when it
      # regenerates a lockfile against an existing tree (npm/cli#4828), and
      # npm ci then installs no native binary on every other OS. A lockfile
      # pruned to linux would build fine in this job and in the deploy, and
      # only break contributors on Windows and macOS -- so assert the whole
      # matrix survived rather than trusting the build to notice.
      - name: Check lockfile covers all platforms
        working-directory: ./frontend
        run: |
          for plat in linux win32 darwin; do
            n=$(grep -c "\"node_modules/@rollup/rollup-$plat" package-lock.json || true)
            echo "@rollup $plat binaries: $n"
            [ "$n" -gt 0 ] || { echo "::error::package-lock.json records no $plat rollup binary; regenerate it per frontend/LOCKFILE.md"; exit 1; }
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Mirrors build_frontend() in sys/scripts/deploy.sh, deliberately: this
      # job exists to rehearse the deploy, so it must install the same way.
      #
      # Both used to delete the lockfile and run `npm install`, because the
      # committed lockfile was generated on Windows and npm records only the
      # optional dependencies of the platform it resolved on (npm/cli#4828) --
      # @rollup/rollup-win32-* and nothing else, so `npm ci` on a Linux runner
      # installed no native binary and vite died with "Cannot find module
      # @rollup/rollup-linux-x64-gnu".
      #
      # The lockfile is now generated from a clean slate, which keeps the full
      # platform matrix instead of pruning to the host, so npm ci resolves the
      # linux binaries here and win32 ones on a dev laptop from one file. See
      # frontend/LOCKFILE.md before regenerating it.
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # Advisory, never blocking. Every severity in eslint.config.js is 'warn'
      # so eslint exits 0 on findings, and continue-on-error covers anything
      # that might arrive at error severity later. A lint finding must not fail
      # the workflow -- the point is visibility, not enforcement.
      #
      # No annotation plumbing needed: eslint emits GitHub workflow commands
      # itself, so each finding already lands on its line in the PR's Files
      # view. (GitHub renders at most 10 per step; the log carries all of them.)
      #
      # It earns the slot: run against BoardView.svelte as it stood before
      # PR #40 and no-unused-vars reports both defects that took a browser
      # session to find, including `dndzone` written as an attribute rather
      # than use:dndzone, which left drag-and-drop dead since f75f15a.
      - name: Lint frontend (advisory)
        working-directory: ./frontend
        continue-on-error: true
        run: npm run lint

      # Before the build: these are the units the build cannot check. A broken
      # drag reorder or a mis-resolved auth redirect compiles perfectly.
      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # vite exits 0 as long as it emitted something, so assert the bundle is
      # actually there. Catches an output-path or config change that silently
      # stops populating backend/static.
      - name: Verify build output
        run: |
          test -f backend/static/index.html || { echo "::error::no index.html in backend/static"; exit 1; }
          ls backend/static/assets/*.js >/dev/null 2>&1 || { echo "::error::no JS bundle in backend/static/assets"; exit 1; }
          ls backend/static/assets/*.css >/dev/null 2>&1 || { echo "::error::no CSS bundle in backend/static/assets"; exit 1; }
          echo "Build output:"
          ls -la backend/static backend/static/assets
