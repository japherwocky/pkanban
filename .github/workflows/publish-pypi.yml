name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest

    # Use PyPI's trusted publishing (no API token needed)
    permissions:
      id-token: write      # For PyPI trusted publishing
      contents: write      # For creating GitHub releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Verify tag matches packaged version
        # A tag like v0.3.0 against a tree still saying 0.2.0 would otherwise
        # build and publish under the wrong number -- and PyPI versions cannot
        # be reused or reassigned, so that mistake is permanent. Fail before
        # publishing if the tag disagrees with either version source.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import re
          import sys
          from pathlib import Path

          tag = __import__("os").environ["TAG"]
          if not tag.startswith("v"):
              sys.exit(f"Tag '{tag}' does not start with 'v'")
          expected = tag[1:]

          pyproject = Path("pyproject.toml").read_text()
          m = re.search(r'^version\s*=\s*["\']([^"\']+)["\']', pyproject, re.M)
          if not m:
              sys.exit("Could not find version in pyproject.toml")
          pyproject_version = m.group(1)

          init = Path("pkanban/__init__.py").read_text()
          m = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', init)
          if not m:
              sys.exit("Could not find __version__ in pkanban/__init__.py")
          init_version = m.group(1)

          problems = []
          if pyproject_version != expected:
              problems.append(f"pyproject.toml says {pyproject_version}, tag says {expected}")
          if init_version != expected:
              problems.append(f"pkanban/__init__.py says {init_version}, tag says {expected}")
          if problems:
              sys.exit("; ".join(problems))
          print(f"OK: tag {tag} matches pyproject.toml and pkanban/__init__.py ({expected})")
          EOF

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz