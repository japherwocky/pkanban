name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if no changes detected'
        required: false
        default: 'false'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  DEPLOY_HOST: pkanban.pearachute.com
  DEPLOY_USER: pkanban
  DEPLOY_PATH: /opt/pkanban

jobs:
  # Check if deployment is actually needed
  check-changes:
    name: Check for Deployment Changes
    runs-on: ubuntu-latest
    outputs:
      deploy_needed: ${{ steps.changes.outputs.deploy_needed }}
      frontend_changed: ${{ steps.changes.outputs.frontend_changed }}
      backend_changed: ${{ steps.changes.outputs.backend_changed }}
      config_changed: ${{ steps.changes.outputs.config_changed }}
    steps:
      - name: Check CI status (if triggered by workflow_run)
        if: github.event_name == 'workflow_run'
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "CI workflow did not succeed (conclusion: ${{ github.event.workflow_run.conclusion }}). Skipping deployment."
            exit 1
          fi
          echo "CI passed, proceeding with deployment check..."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for relevant changes
        id: changes
        run: |
          # For workflow_dispatch, always deploy (user manually triggered)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy_needed=true" >> $GITHUB_OUTPUT
            echo "frontend_changed=true" >> $GITHUB_OUTPUT
            echo "backend_changed=true" >> $GITHUB_OUTPUT
            echo "config_changed=true" >> $GITHUB_OUTPUT
            echo "Manual deployment triggered"
            exit 0
          fi

          # For workflow_run: determine the baseline commit
          if [ -n "${{ github.event.before }}" ]; then
            BASELINE="${{ github.event.before }}"
          else
            BASELINE="HEAD~1"
          fi

          if [ "${{ github.event.inputs.force_deploy }}" = "true" ]; then
            echo "deploy_needed=true" >> $GITHUB_OUTPUT
            echo "frontend_changed=true" >> $GITHUB_OUTPUT
            echo "backend_changed=true" >> $GITHUB_OUTPUT
            echo "config_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get the list of changed files
          CHANGED_FILES=$(git diff --name-only "$BASELINE" HEAD)

          frontend_changed=false
          backend_changed=false
          config_changed=false
          deploy_needed=false

          # Check frontend changes
          if echo "$CHANGED_FILES" | grep -q "^frontend/"; then
            frontend_changed=true
            deploy_needed=true
          fi

          # Check backend changes
          if echo "$CHANGED_FILES" | grep -E "^backend/|^manage\.py$"; then
            backend_changed=true
            deploy_needed=true
          fi

          # Check deployment configuration changes
          if echo "$CHANGED_FILES" | grep -E "^sys/"; then
            config_changed=true
            deploy_needed=true
          fi

          # Check documentation changes. The docs pages are served from docs/
          # at runtime (backend reads the .md files directly), not built into
          # the frontend bundle -- so a docs-only change is a real deploy.
          # Without this, doc updates silently never reached production.
          docs_changed=false
          if echo "$CHANGED_FILES" | grep -qE "^docs/"; then
            docs_changed=true
            deploy_needed=true
          fi

          # NOTE: for a multi-commit push the baseline above is HEAD~1, so only
          # the final commit is inspected. A push whose watched change is in an
          # earlier commit can still be missed. Manual re-run via
          # workflow_dispatch is the escape hatch until that's addressed.

          echo "deploy_needed=$deploy_needed" >> $GITHUB_OUTPUT
          echo "frontend_changed=$frontend_changed" >> $GITHUB_OUTPUT
          echo "backend_changed=$backend_changed" >> $GITHUB_OUTPUT
          echo "config_changed=$config_changed" >> $GITHUB_OUTPUT

          echo "Changes detected:"
          echo "  Frontend: $frontend_changed"
          echo "  Backend: $backend_changed"
          echo "  Config: $config_changed"
          echo "  Docs: $docs_changed"
          echo "  Deploy needed: $deploy_needed"

  # Deploy to production
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.deploy_needed == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "🚀 Starting deployment to production..."

            # Configure git for the pkanban user (needed for git pull)
            cd ${{ env.DEPLOY_PATH }}
            git config --global user.email "deploy@github.actions"
            git config --global user.name "GitHub Actions"

            # Captured before the reset below. deploy.sh needs the pre-deploy
            # commit to tell what changed, and cannot work it out itself: this
            # step has already moved HEAD by the time it runs, so its own
            # `git rev-parse HEAD` would return the new commit and every diff
            # would come back empty. That is what skipped the pip install on
            # the deploy that added peewee-migrate.
            PREVIOUS_SHA=$(git rev-parse HEAD)

            # Reset hard to ensure we have the latest code. Done here rather
            # than leaving it to deploy.sh so that changes to deploy.sh itself
            # take effect on the deploy that ships them.
            git fetch origin
            git reset --hard origin/main

            # Ensure deploy script is executable (git doesn't preserve permissions)
            chmod +x sys/scripts/deploy.sh

            # Run the existing deploy script - it handles everything!
            DEPLOY_PREVIOUS_SHA="$PREVIOUS_SHA" sys/scripts/deploy.sh

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."

          # Wait for service to be fully ready
          sleep 10

          # This step used to accept "200|404" against /api/health, an endpoint
          # that did not exist -- so it passed unconditionally and a broken
          # database, a 500ing API and an unmigrated schema all reported
          # success. Accepting 404 was enough on its own to make it
          # unfalsifiable; before main.py started 404ing unmatched /api/ paths,
          # the SPA catch-all answered them 200 with index.html, which made it
          # doubly so.
          #
          # /api/health now exists and queries the database, so a schema or
          # connection problem surfaces as 503. Match on the JSON body, not the
          # status code, so removing the route fails the deploy rather than
          # quietly satisfying it again.
          BODY=$(curl -s --max-time 15 https://pkanban.pearachute.com/api/health || true)
          echo "Health response: $BODY"

          if echo "$BODY" | grep -q '"status":"ok"'; then
            echo "✅ Application is healthy"
          else
            echo "❌ Health check failed"
            echo "--- /api/health ---"
            curl -s -i --max-time 15 https://pkanban.pearachute.com/api/health || true
            echo "--- service logs ---"
            exit 1
          fi

  # Post-deployment notifications
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [check-changes, deploy]
    if: always() && needs.check-changes.outputs.deploy_needed == 'true'
    steps:
      - name: Get deployment status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=🎉 Production deployment completed successfully!" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Production deployment failed!" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR (if applicable)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const message = `${{ steps.status.outputs.message }}

            **Changes deployed:**
            - Frontend: ${{ needs.check-changes.outputs.frontend_changed }}
            - Backend: ${{ needs.check-changes.outputs.backend_changed }}
            - Configuration: ${{ needs.check-changes.outputs.config_changed }}

            **Commit:** ${{ github.sha }}
            **Deployed by:** ${{ github.actor }}

            🌐 **Live at:** https://pkanban.pearachute.com`;

            // Find any open PRs that might be related to this push
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main'
            });

            for (const pr of pulls) {
              if (pr.head.sha === context.sha) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: message
                });
                break;
              }
            }
